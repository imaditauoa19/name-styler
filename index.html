<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J3T18KYVNC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-J3T18KYVNC');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الزخرفة العالمية</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <meta name="description" content="أفضل موقع لزخرفة الأسماء العربية والإنجليزية ورموز ببجي وفري فاير مجاناً وبنقرة واحدة.">
    <meta name="keywords" content="زخرفة اسماء, زخرفة عربي, زخرفة انجليزي, اسماء ببجي, رموز زخرفة, زخرفة فري فاير">
    <meta name="author" content="إمبراطور الزخرفة">

</head>
<body>
  
  <div style="position: absolute; top: 15px; right: 15px; z-index: 1000;">
    <button id="theme-toggle" style="background: #1a1a2e; color: #00ffcc; border: 1px solid #00ffcc; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-family: 'Cairo', sans-serif; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);">🌙 الوضع الليلي</button>
  </div>


    <div class="container">

        <h1>👑 STERBEN 👑</h1>
        <p class="subtitle">أدخل اسمك، وشاهد مئات الزخارف والخطوط النادرة تتولد فوراً!</p>

        <div class="input-group">
            <input type="text" id="username" placeholder="اكتب اسمك هنا (عربي أو إنجليزي)..." oninput="generateAllDecorations()">
        </div>

        <div class="stats" id="stats-text">اكتب شيئاً لتبدأ السحر...</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="filterType('all')">الكل</button>
            <button class="tab-btn" onclick="filterType('ar')">عربي</button>
            <button class="tab-btn" onclick="filterType('en')">إنجليزي</button>
            <button class="tab-btn" onclick="filterType('sym')">رموز وأسلحة</button>
        </div>

        <div class="results-grid" id="results">
        </div>
    </div>

    <div id="toast" class="toast">تم النسخ التلقائي! 📋✨</div>

    <script src="script.js"></script>
    
    <script>
    const btn = document.getElementById('theme-toggle');
    btn.addEventListener('click', function() {
        const body = document.body;
        if (body.style.background === 'white') {
            body.style.background = '#0d0d1a'; 
            body.style.color = 'white';
            btn.innerText = '🌙 الوضع الليلي';
            btn.style.background = '#1a1a2e';
            btn.style.color = '#00ffcc';
        } else {
            body.style.background = 'white';
            body.style.color = 'black';
            btn.innerText = '☀️ الوضع النهاري';
            btn.style.background = '#f0f0f0';
            btn.style.color = '#1a1a2e';
        }
    });
</script>

</body>
</html>
