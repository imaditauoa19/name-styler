<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الزخرفة العالمية</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet"> 
    <meta name="description" content="أفضل موقع لزخرفة الأسماء العربية والإنجليزية ورموز ببجي وفري فاير مجاناً وبنقرة واحدة.">
<meta name="keywords" content="زخرفة اسماء, زخرفة عربي, زخرفة انجليزي, اسماء ببجي, رموز زخرفة, زخرفة فري فاير">
<meta name="author" content="إمبراطور الزخرفة">
</head>
<body>

    <div class="container">
        <div style="text-align: center; margin-bottom: 20px; font-family: 'Cairo', sans-serif;">
    <span style="color: #ffffff; font-size: 16px;">عدد الزيارات: </span>
    <span id="local-visitor-count" style="color: #00ffcc; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #00ffcc;">1</span>
</div>

<script>
    // كود برجي بسيط لزيادة الرقم وحفظه في ذاكرة الهاتف
    let currentVisits = localStorage.getItem('my_site_visits');
    
    if (!currentVisits) {
        currentVisits = 1;
    } else {
        currentVisits = parseInt(currentVisits) + 1;
    }
    
    localStorage.setItem('my_site_visits', currentVisits);
    document.getElementById('local-visitor-count').innerText = currentVisits;
</script>
        
        <h1>👑 STERBEN 👑</h1>
        <p class="subtitle">أدخل اسمك، وشاهد مئات الزخارف والخطوط النادرة تتولد فوراً!</p>

        <div class="input-group">
            <input type="text" id="username" placeholder="اكتب اسمك هنا (عربي أو إنجليزي)..." oninput="generateAllDecorations()">
        </div>

        <div class="stats" id="stats-text">اكتب شيئاً لتبدأ السحر...</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="filterType('all')">الكل</button>
            <button class="tab-btn" onclick="filterType('ar')">عربي</button>
            <button class="tab-btn" onclick="filterType('en')">إنجليزي</button>
            <button class="tab-btn" onclick="filterType('sym')">رموز وأسلحة</button>
        </div>

        <div class="results-grid" id="results">
            </div>
    </div>

    <div id="toast" class="toast">تم النسخ التلقائي! 📋✨</div>

    <script src="script.js"></script>
</body>
</html>
